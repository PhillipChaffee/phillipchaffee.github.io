name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout resume
        uses: actions/checkout@v7
        with:
          repository: PhillipChaffee/resume
          path: tmp/resume
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test resume theme
        run: node --test resume-theme/test.js

      - name: Install script dependencies
        run: npm install puppeteer js-yaml

      - name: Render all resume branches
        run: |
          cd tmp/resume
          for branch in $(git branch -r | grep -v HEAD | sed 's|.*origin/||'); do
            git checkout "$branch"
            if [ "$branch" = "master" ]; then
              node ../../scripts/render-resume.js resume.json ../../resume-theme ../../resume
              node ../../scripts/generate-pdf.js ../../resume/index.html ../../resume/phillip-chaffee-resume.pdf
            else
              node ../../scripts/render-resume.js resume.json ../../resume-theme "../../resume/$branch" "$branch"
              node ../../scripts/generate-pdf.js "../../resume/$branch/index.html" "../../resume/$branch/phillip-chaffee-resume.pdf"
            fi
          done
          cd ../..

      - name: Fetch projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-projects.js "${{ github.repository_owner }}" _config.yml _data/projects.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
